name: Build Anthias OS image

# Tag a release to publish; dispatch manually to test without publishing.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['**.bb', '**.bbappend', '**.conf', '**.inc', 'kas/**', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      machine:
        description: Machine to build
        type: choice
        options: [nanopi-r3s-lts, nanopi-r3s]
        default: nanopi-r3s-lts

permissions:
  contents: read

env:
  # Hosted runners have ~14 GB free on / but a much larger ephemeral volume
  # mounted at /mnt. A Yocto TMPDIR will not fit on / under any circumstances.
  KAS_WORK_DIR: /mnt/yocto/layers
  KAS_BUILD_DIR: /mnt/yocto/build
  DL_DIR: /mnt/yocto/downloads
  SSTATE_DIR: /mnt/yocto/sstate-cache

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350   # hosted runners hard-stop at 360
    strategy:
      fail-fast: false
      matrix:
        machine: ["${{ inputs.machine || 'nanopi-r3s-lts' }}"]
    outputs:
      version: ${{ steps.artefacts.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Yocto is cross-compiling regardless of runner arch, so x86_64 runners
      # produce identical aarch64 output. They are just slower than the 6-core
      # box this was measured on (~75 min cold); budget ~2 h.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo mkdir -p /mnt/yocto
          sudo chown -R "$USER:$USER" /mnt/yocto
          df -h / /mnt

      - name: Install host dependencies
        run: |
          sudo apt-get update
          # This is the Yocto Project's documented host requirement list for
          # Debian/Ubuntu, verbatim. python3-pip is in it because bitbake wants
          # it present, not because we install anything with it - kas comes
          # from uv below.
          sudo apt-get install -y --no-install-recommends \
            gawk wget git diffstat unzip texinfo gcc build-essential chrpath \
            socat cpio python3 python3-pip python3-pexpect xz-utils \
            debianutils iputils-ping python3-git python3-jinja2 \
            python3-subunit zstd lz4 file libacl1-dev

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install kas
        run: uv tool install kas

      # BitBake needs unprivileged user namespaces; Ubuntu restricts them via
      # AppArmor and the build cannot start without this.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Restore sstate cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /mnt/yocto/sstate-cache
          key: sstate-${{ matrix.machine }}-${{ hashFiles('**/*.bb', '**/*.bbappend', '**/*.conf', 'kas/*.yml') }}
          restore-keys: |
            sstate-${{ matrix.machine }}-

      # Only tagged builds get a real signing key; PR builds stay dev-signed
      # and are never published.
      - name: Materialise signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RAUC_KEY: ${{ secrets.RAUC_SIGNING_KEY }}
          RAUC_CERT: ${{ secrets.RAUC_SIGNING_CERT }}
          RAUC_CA: ${{ secrets.RAUC_CA_CERT }}
        run: |
          test -n "$RAUC_KEY" || { echo "::error::RAUC_SIGNING_KEY secret is not set"; exit 1; }
          # tmpfs: the private key never touches the runner's disk.
          sudo mkdir -p /run/anthias-pki
          sudo mount -t tmpfs -o size=1M,mode=0700 tmpfs /run/anthias-pki
          sudo chown "$USER:$USER" /run/anthias-pki
          umask 077
          printf '%s' "$RAUC_KEY"  > /run/anthias-pki/development-1.key.pem
          printf '%s' "$RAUC_CERT" > /run/anthias-pki/development-1.cert.pem
          printf '%s' "$RAUC_CA"   > recipes-core/rauc/files/ca.cert.pem
          echo "SIGNING=1" >> "$GITHUB_ENV"

      - name: Build
        run: |
          CONFIG="kas/anthias-${{ matrix.machine }}.yml:kas/ci.yml"
          if [ "${SIGNING:-0}" = "1" ]; then
            CONFIG="$CONFIG:kas/production.yml"
            export ANTHIAS_SIGNING_DIR=/run/anthias-pki
            export ANTHIAS_UPDATE_URL="${{ vars.ANTHIAS_UPDATE_URL }}"
            export ANTHIAS_SSH_AUTHORIZED_KEY="${{ secrets.ANTHIAS_SSH_AUTHORIZED_KEY }}"
            # Must match the manifest's "version" exactly - the device compares
            # it as a plain string against /etc/anthias-version.
            export ANTHIAS_VERSION="${GITHUB_REF_NAME}"
          fi
          kas build "$CONFIG"

      - name: Collect artefacts
        id: artefacts
        run: |
          DEPLOY=/mnt/yocto/build/tmp/deploy/images/${{ matrix.machine }}
          mkdir -p out
          cp -L "$DEPLOY"/anthias-image-${{ matrix.machine }}.rootfs.wic       out/
          cp -L "$DEPLOY"/anthias-image-${{ matrix.machine }}.rootfs.wic.bmap  out/
          cp -L "$DEPLOY"/anthias-bundle-${{ matrix.machine }}.raucb           out/
          cp -L "$DEPLOY"/anthias-image-${{ matrix.machine }}.rootfs.spdx.json out/ || true
          # The .wic is mostly zeroes; xz takes ~900 MB down to well under the
          # 2 GB per-asset release limit and saves the fleet bandwidth.
          xz -T0 -6 out/anthias-image-${{ matrix.machine }}.rootfs.wic
          ( cd out && sha256sum * > SHA256SUMS )
          # RAUC_BUNDLE_VERSION is "${DISTRO_VERSION}-${DATETIME}"; the deploy
          # symlink points at the timestamped file, so read it from there
          # rather than needing rauc on the runner.
          # Must be byte-identical to ANTHIAS_VERSION baked into the rootfs,
          # otherwise every device sees a permanent "update available".
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          ls -lh out

      - name: Save sstate cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: /mnt/yocto/sstate-cache
          key: sstate-${{ matrix.machine }}-${{ hashFiles('**/*.bb', '**/*.bbappend', '**/*.conf', 'kas/*.yml') }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anthias-${{ matrix.machine }}
          path: out/
          retention-days: 14

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the release
      id-token: write      # keyless signing / provenance
      attestations: write
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { path: dist }

      # SLSA provenance: proves these bytes came out of this workflow at this
      # commit. This is distribution integrity, and is separate from the RAUC
      # signature, which is what the device itself checks before installing.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/**/*.raucb,dist/**/*.wic.xz'

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/**/*
          generate_release_notes: true

      # Pages hosts only the small JSON manifests. Bundles stay on Releases:
      # a Pages site is capped at 1 GB, which is six of our 163 MB bundles.
      - name: Build manifest site
        run: |
          mkdir -p site
          for d in dist/*/; do
            m=$(basename "$d" | sed 's/^anthias-//')
            bundle="anthias-bundle-${m}.raucb"
            [ -f "$d/$bundle" ] || continue
            sha=$(awk -v f="$bundle" '$2==f{print $1}' "$d/SHA256SUMS")
            mkdir -p "site/$m"
            cat > "site/$m/latest.json" <<JSON
          {
            "compatible": "$m",
            "version": "${{ needs.build.outputs.version }}",
            "url": "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/$bundle",
            "sha256": "$sha"
          }
          JSON
          done
          find site -type f -print -exec cat {} \;

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: site }
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
