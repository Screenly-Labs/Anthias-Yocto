[system]
compatible=@MACHINE@
bootloader=uboot
data-directory=/data/rauc
# The boot script keeps three tries per slot; rauc resets the counter of the
# slot it just marked good.
boot-attempts=3

[keyring]
# meta-rauc's rauc-conf installs the keyring under ${nonarch_libdir}, not
# /etc: on rauc 1.15 there is no /etc/rauc in the image at all.
path=/usr/lib/rauc/ca.cert.pem
# The signing cert carries extendedKeyUsage=codeSigning. rauc verifies CMS
# with the S/MIME signing purpose unless told otherwise, which rejects our
# own bundle with "unsuitable certificate purpose".
check-purpose=codesign

[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootfsA
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootfsB
type=ext4
bootname=B
