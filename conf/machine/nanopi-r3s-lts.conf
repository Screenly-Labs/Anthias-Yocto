#@TYPE: Machine
#@NAME: FriendlyELEC NanoPi R3S LTS
#@DESCRIPTION: Rockchip RK3566 SBC, 1/2 GB LPDDR4X, optional 32 GB eMMC,
# dual Gigabit Ethernet (native GMAC + PCIe RTL8111H), USB 3.0 and — unlike
# the original NanoPi R3S — a full-size HDMI output, which is what makes it
# usable as a digital signage player.
# https://wiki.friendlyelec.com/wiki/index.php/NanoPi_R3S

require conf/machine/include/nanopi-r3s.inc

# rk3566-nanopi-r3s-lts.dts (shipped by meta-anthias, see
# recipes-kernel/linux/) is the upstream rk3566-nanopi-r3s.dts plus the HDMI
# output the LTS board adds. The stock R3S dtb is kept in the fitImage so the
# same image boots on a non-LTS board (headless).
KERNEL_DEVICETREE = "rockchip/rk3566-nanopi-r3s-lts.dtb rockchip/rk3566-nanopi-r3s.dtb"
