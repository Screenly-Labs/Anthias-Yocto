# meta-anthias — Anthias digital signage OS for Rockchip SBCs
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "anthias"
BBFILE_PATTERN_anthias = "^${LAYERDIR}/"
# Higher than meta-rockchip (1), meta-rauc (6) and meta-virtualization (8) so
# our bbappends and our FILESEXTRAPATHS win over the reference/demo ones.
BBFILE_PRIORITY_anthias = "12"

LAYERVERSION_anthias = "1"
LAYERSERIES_COMPAT_anthias = "wrynose"
LAYERDEPENDS_anthias = "core rockchip rauc virtualization-layer openembedded-layer networking-layer"
