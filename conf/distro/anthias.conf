# Anthias OS — a Poky derivative tuned for a single-purpose, containerised
# digital signage appliance that is field-updated with RAUC.
require conf/distro/poky.conf

DISTRO = "anthias"
DISTRO_NAME = "Anthias OS"
DISTRO_VERSION = "0.1.0"
DISTRO_CODENAME = "nanopi"
SDK_VENDOR = "-anthiassdk"
MAINTAINER = "Anthias <https://github.com/Screenly/Anthias>"

# systemd everywhere: the RAUC reference integration in meta-rockchip uses
# systemd-repart to lay down the B slot and the data partition on first boot,
# and Anthias' compose file logs to the journal.
INIT_MANAGER = "systemd"

DISTRO_FEATURES:append = " systemd virtualization rauc"

# Nothing on the *host* draws to the screen. The Anthias viewer container
# ships its own compositor (cage) and its own Mesa, and takes DRM master on
# /dev/dri/card0 directly, exactly as it does on Armbian/Raspberry Pi OS
# today. Dropping the graphics stacks from the host keeps the A/B slots small
# and the build short.
DISTRO_FEATURES:remove = "x11 wayland vulkan opengl ptest bluetooth 3g nfc pcmcia usbgadget"

# The image is rolled forward as a whole by RAUC; there is no on-device
# package manager workflow to support.
PACKAGE_CLASSES ?= "package_ipk"
