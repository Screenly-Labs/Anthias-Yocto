# Base URL of the update manifest tree. The updater fetches
#   ${ANTHIAS_UPDATE_URL}/${compatible}/latest.json
# where ${compatible} comes from /usr/lib/rauc/system.conf.
#
# Set at build time with ANTHIAS_UPDATE_URL in the distro/local conf, or edit
# here on a device to pin it at a staging channel.
ANTHIAS_UPDATE_URL=@ANTHIAS_UPDATE_URL@

# Set to 0 to stage updates without rebooting (they apply at the next reboot).
ANTHIAS_UPDATE_REBOOT=1
