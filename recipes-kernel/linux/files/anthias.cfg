# Display pipeline for the RK3566 — the one thing a signage player cannot
# boot without. arm64 defconfig builds most of this as modules; the viewer
# container needs /dev/dri to exist before it starts, so keep it built in.
CONFIG_DRM=y
CONFIG_DRM_ROCKCHIP=y
CONFIG_ROCKCHIP_VOP2=y
CONFIG_ROCKCHIP_DW_HDMI=y
CONFIG_ROCKCHIP_ANALOGIX_DP=n
CONFIG_DRM_DW_HDMI=y
CONFIG_DRM_PANFROST=y
CONFIG_DRM_FBDEV_EMULATION=y

# HDMI audio
CONFIG_SND=y
CONFIG_SND_SOC=y
CONFIG_SND_SOC_ROCKCHIP=y
CONFIG_SND_SOC_ROCKCHIP_I2S_TDM=y
CONFIG_SND_SOC_HDMI_CODEC=y
CONFIG_SND_SIMPLE_CARD=y

# Networking: native GMAC1 plus the PCIe-attached RTL8111H on the second port
CONFIG_STMMAC_ETH=y
CONFIG_DWMAC_ROCKCHIP=y
CONFIG_R8169=y
CONFIG_PCIE_ROCKCHIP_DW=y
CONFIG_PHY_ROCKCHIP_NANENG_COMBPHY=y

# RAUC: bundles are squashfs images mounted through dm-verity, and
# fw_setenv writes the U-Boot environment partition back.
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XZ=y
CONFIG_SQUASHFS_ZSTD=y
CONFIG_BLK_DEV_LOOP=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_VERITY=y

# systemd-repart grows the disk into rootfsB + data on first boot
CONFIG_EFI_PARTITION=y
CONFIG_EXT4_FS=y
CONFIG_EXT4_FS_POSIX_ACL=y

# Docker storage driver
CONFIG_OVERLAY_FS=y
CONFIG_OVERLAY_FS_REDIRECT_DIR=y
CONFIG_OVERLAY_FS_XINO_AUTO=y

# HDMI-CEC — Anthias drives display power over CEC from the viewer container
CONFIG_MEDIA_CEC_SUPPORT=y
CONFIG_CEC_CORE=y
